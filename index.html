<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEOcortex Zero Room</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="scanlines"></div>
    <main id="app" class="viewport">
      <header class="topbar">
        <button id="prevBtn" class="nav-btn">‹</button>
        <div class="headline-wrap">
          <div id="screenTitle" class="headline echo">ZERO ROOM: WAKE</div>
          <div class="dotbar">
            <span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
        </div>
        <button id="nextBtn" class="nav-btn">›</button>
      </header>

      <section id="screen"></section>

      <footer class="footer">SYSTEM: ACTIVE · CONNECTION: STABLE · MODE: LOCAL-FIRST</footer>
    </main>

    <template id="wakeTpl">
      <div class="panel narrow">
        <p class="line">SUBJECT CONTEXT ID :: LOCAL-SESSION</p>
        <p class="line">SPACE REVISION :: R0</p>
        <p class="line">SESSION ANCHOR :: NOT SET</p>
        <hr/>
        <p class="line">WAKE SEQUENCE ACCEPTED</p>
        <p class="line">PRIVACY MODE :: LOCAL-FIRST</p>
        <p class="line">ACTIVE MODULES :: ZERO-ROOM, ENTOURAGE, MAP</p>
        <p class="line amber">CLARIFICATION QUEUE :: 2 OPEN</p>
        <p class="line">LAST CONSOLIDATION :: PENDING</p>
        <div class="actions">
          <button data-action="status" class="cta ghost">OPEN SYSTEM STATUS</button>
          <button data-action="chat" class="cta">ENTER ENTOURAGE CHANNEL</button>
        </div>
      </div>
    </template>

    <template id="statusTpl">
      <div class="grid">
        <div class="metric">IMPORTED NOTES :: <b id="mNotes">0</b></div>
        <div class="metric">NODE COUNT :: <b id="mNodes">0</b></div>
        <div class="metric">DETERMINISTIC LINKS :: <b id="mLinks">0</b></div>
        <div class="metric">HYPOTHESIS LINKS :: <b id="mHyp">0</b></div>
        <div class="metric">TENSIONS :: <b id="mTensions">0</b></div>
        <div class="metric">REVISION COUNT :: <b id="mRev">0</b></div>
      </div>
      <div class="status-strip">
        <button id="importBtn" class="cta">IMPORT NOTES</button>
        <button id="mapBtn" class="cta ghost">OPEN SUBJECT MAP</button>
        <button id="timelineBtn" class="cta ghost">OPEN TIMELINE</button>
      </div>
      <pre id="timeline" class="console"></pre>
    </template>

    <template id="shellTpl">
      <div class="panel narrow">
        <p class="anchor-number">10</p>
        <p class="line">SESSION ORIENTATION INITIALIZED</p>
        <ol class="line-list">
          <li>SELECT SESSION ANCHOR</li>
          <li>CHOOSE CHANNEL: ENTOURAGE / MAP / IMPORT</li>
          <li>CONFIRM CURRENT INTENT</li>
          <li>MARK UNRESOLVED TENSION (OPTIONAL)</li>
        </ol>
        <div class="intrusion">INTRUSION EVENT: PERCEPTUAL LAYER ACTIVE</div>
      </div>
    </template>

    <template id="anchorTpl">
      <div class="panel narrow">
        <label class="line red">SESSION ANCHOR INPUT</label>
        <input id="anchorInput" class="anchor-input" placeholder="e.g. conflict-of-day: duty vs exhaustion" />
        <button id="submitAnchor" class="cta">SUBMIT // HOLD</button>
        <div class="chat">
          <div id="chatLog" class="console small"></div>
          <input id="chatInput" class="anchor-input" placeholder="message to entourage" />
          <button id="chatSend" class="cta ghost">SEND</button>
        </div>
      </div>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
